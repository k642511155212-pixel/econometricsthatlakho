<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="description" content="Econometrics Mastery v4 — deep bilingual theory, native structured formulas, 980 explained questions, terminology recall, short answers, review hubs, diagnostics and empirical workflow." />
  <meta name="color-scheme" content="light" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Econometrics Mastery" />
  <meta property="og:description" content="OLS · Inference · Diagnostics · Bilingual key terms · 980 explained questions · 380 Wooldridge test-bank items" />
  <title>Econometrics Mastery</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f7f7f5'/%3E%3Cpath d='M12 49h42M15 46V12' stroke='%23292421' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='38' r='3.5' fill='%23b4553f'/%3E%3Ccircle cx='29' cy='31' r='3.5' fill='%23b4553f'/%3E%3Ccircle cx='36' cy='29' r='3.5' fill='%23b4553f'/%3E%3Ccircle cx='43' cy='21' r='3.5' fill='%23b4553f'/%3E%3Ccircle cx='49' cy='19' r='3.5' fill='%23b4553f'/%3E%3Cpath d='M18 40L51 16' stroke='%23315d33' stroke-width='3'/%3E%3C/svg%3E" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-meta shell">
      <span><i class="live-dot"></i>ECONOMETRICS · OLS → INFERENCE → DIAGNOSTICS</span>
      <span class="header-meta-right">Understand the model · Check assumptions · Explain the result</span>
    </div>
    <div class="nav-shell shell">
      <a class="brand" href="#dashboard" aria-label="Econometrics Mastery home">
        <span class="brand-mark">β̂</span>
        <span class="brand-copy"><strong>ECONOMETRICS</strong><small>MASTERY</small></span>
      </a>
      <nav class="top-nav" id="topNav" aria-label="Primary navigation">
        <a href="#learn">Learn</a>
        <a href="#practice">Practice</a>
        <a href="#review">Review</a>
        <a href="#glossary">Terms</a>
        <a href="#mixed-exam">Exam</a>
        <a href="#formulas">Formulas</a>
        <a href="#menu">Tools</a>
      </nav>
      <div class="nav-actions">
        <button class="search-trigger" id="searchTrigger" aria-label="Search lessons, terms and questions" title="Search · Ctrl/⌘ K">⌕</button>
        <button class="progress-pill" data-route="progress" aria-label="Open progress"><span id="headerProgress">0%</span><small>progress</small></button>
        <button class="primary-pill" data-route="practice">Self-test ↗</button>
        <button class="menu-trigger" id="menuTrigger" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="globalSearchDialog" class="global-search-dialog" aria-labelledby="globalSearchTitle">
    <div class="global-search-head">
      <div><span class="eyebrow">GLOBAL SEARCH</span><h2 id="globalSearchTitle">Find a lesson, term, formula or question</h2></div>
      <button id="globalSearchClose" class="search-close" type="button" aria-label="Close search">ESC</button>
    </div>
    <label class="global-search-box">
      <span aria-hidden="true">⌕</span>
      <input id="globalSearchInput" type="search" autocomplete="off" placeholder="Try “OLS”, “phương sai thay đổi”, “VIF”, or “log-level”…" />
      <kbd>⌘ K</kbd>
    </label>
    <div id="globalSearchResults" class="global-search-results" aria-live="polite"></div>
  </dialog>

  <div id="annotationToolbar" class="annotation-toolbar" hidden>
    <button data-anno="highlight" data-color="yellow" title="Yellow highlight">● Yellow</button>
    <button data-anno="highlight" data-color="green" title="Green highlight">● Green</button>
    <button data-anno="highlight" data-color="pink" title="Pink highlight">● Pink</button>
    <button data-anno="highlight" data-color="blue" title="Blue highlight">● Blue</button>
    <button data-anno="comment">Comment</button>
    <button data-anno="flashcard">Flashcard</button>
  </div>

  <dialog id="noteDialog" class="note-dialog">
    <form method="dialog" class="note-dialog-card" id="noteForm">
      <div class="note-dialog-head"><div><span class="eyebrow">STUDY NOTE</span><h2 id="noteDialogTitle">Add note</h2></div><button type="button" class="icon-close" data-note-close aria-label="Close note editor">×</button></div>
      <div class="note-quote-preview"><span>Selected passage</span><blockquote id="noteQuotePreview"></blockquote></div>
      <label class="note-field"><span>Your note</span><textarea id="noteText" rows="6" maxlength="1600" placeholder="Write the reasoning, warning, assumption or interpretation you want to remember…"></textarea></label>
      <div class="note-dialog-options">
        <label><span>Highlight color</span><select id="noteColor"><option value="yellow">Yellow</option><option value="green">Green</option><option value="pink">Pink</option><option value="blue">Blue</option></select></label>
        <label class="note-check"><input id="noteHighlight" type="checkbox" checked><span>Highlight this passage in the lesson</span></label>
      </div>
      <div class="note-dialog-actions"><button type="button" class="text-btn" data-note-close>Cancel</button><button type="submit" class="green-btn" id="saveNoteBtn">Save note</button></div>
    </form>
  </dialog>

  <script src="embedded-assets.js"></script>
  <script src="data.js"></script>
  <script src="source-extensions.js"></script>
  <script src="deep-econometrics.js"></script>
  <script src="extended-theory.js"></script>
  <script src="testbank-data.js"></script>
  <script src="annotations.js"></script>
  <script src="app.js"></script>
</body>
</html>
